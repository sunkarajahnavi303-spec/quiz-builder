<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Quiz Builder</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="form-page">

        <div class="form-container">

            <h1>
                Quiz Builder
            </h1>

            <h2>
                Create Account
            </h2>


            <!-- SIGN UP FORM -->

            <form id="signupForm">

                <div class="form-group">

                    <label for="signupName">
                        Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create password"
                        required
                    >

                </div>


                <button type="submit">
                    Sign Up
                </button>

            </form>


            <!-- SIGN UP MESSAGE -->

            <p
                id="signupMessage"
                class="success-message">
            </p>


            <!-- LOGIN LINK -->

            <p>

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <!-- AUTHENTICATION JAVASCRIPT -->

    <script src="js/auth.js"></script>

</body>

</html>
