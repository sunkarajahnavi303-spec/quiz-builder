<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Dashboard - Quiz Builder</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ===============================
         NAVBAR
    ================================ -->

    <header class="navbar">

        <div class="logo">
            Quiz Builder - User
        </div>

        <div class="nav-buttons">

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </header>


    <!-- ===============================
         USER DASHBOARD
    ================================ -->

    <main class="dashboard">

        <div class="dashboard-header">

            <div>

                <h1>
                    User Dashboard
                </h1>

                <p id="welcomeMessage">
                    Welcome!
                </p>

            </div>

        </div>


        <!-- ===============================
             AVAILABLE QUIZZES
        ================================ -->

        <h2>
            Available Quizzes
        </h2>

        <br>

        <div
            id="quizContainer"
            class="card-grid"
        >

            <!-- Quizzes will appear here -->

        </div>

    </main>


    <script src="js/user.js"></script>

</body>

</html>
